/* ===== EAGLETON · sage-green glass theme ===== */
:root{color-scheme:light;--bg:#c9d6bd;--c:rgba(255,255,255,.46);--t:#1e3226;--m:#566d5c;--b:rgba(30,50,38,.14);--p:#3b6a4c;--pt:#fff;--ok:#2d7a4b;--w:#96680f;--d:#b5463a;--i:#3b6a4c;--soft:rgba(255,255,255,.42);--soft2:rgba(255,255,255,.26);--r:24px;
 --edge:rgba(255,255,255,.55);--side:rgba(214,230,204,.55);--panel:rgba(222,236,212,.55);--mc:rgba(245,249,240,.92);--btn:linear-gradient(135deg,#6d9679,#3b6a4c);--btnfg:#fff;--sh:0 12px 36px rgba(40,70,48,.14);
 --ov:linear-gradient(rgba(176,198,163,.84),rgba(160,186,148,.88));--g1:#eef3e6;--g2:#b5c8a6;--g3:#8fa985;--g4:#dce6d0}
[data-theme=dark]{color-scheme:dark;--bg:#2a4033;--c:rgba(255,255,255,.08);--t:#eef5ea;--m:#aec4b2;--b:rgba(255,255,255,.16);--p:#cfe6bf;--pt:#10231a;--ok:#98e6b0;--w:#f0d58a;--d:#ffa89b;--i:#c4e3cf;--soft:rgba(255,255,255,.10);--soft2:rgba(255,255,255,.06);
 --edge:rgba(255,255,255,.20);--side:rgba(40,68,51,.62);--panel:rgba(36,62,46,.58);--mc:rgba(34,58,43,.96);--btn:linear-gradient(135deg,#eef6dc,#bfd9a6);--btnfg:#10231a;--sh:0 14px 40px rgba(8,22,14,.38);
 --ov:linear-gradient(rgba(46,76,57,.80),rgba(34,58,43,.88));--g1:#5d8c6b;--g2:#233b2c;--g3:#41704f;--g4:#1c3025}
html{background:var(--bg)}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t);background:var(--ov),url(/img/bg.jpg) center/cover no-repeat fixed,var(--bg)}
/* soft drifting colour orbs sit behind the glass */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(70px)}
body::before{width:56vmax;height:56vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,var(--g1),transparent 68%);opacity:.55;animation:orb1 22s ease-in-out infinite alternate}
body::after{width:60vmax;height:60vmax;right:-20vmax;bottom:-24vmax;background:radial-gradient(circle,var(--g3),transparent 66%);opacity:.45;animation:orb2 26s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(8vmax,6vmax) scale(1.08)}}@keyframes orb2{to{transform:translate(-7vmax,-5vmax) scale(1.1)}}
h2,.card b,.bnr{font-family:"Fraunces",Georgia,"Times New Roman",serif}
h2{font-size:28px;font-weight:600;letter-spacing:-.01em}h4{font-weight:650}
::placeholder{color:color-mix(in srgb,var(--t) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--t) 24%,transparent);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
/* wordmark: the O is a golf ball */
.wm{font-weight:700;letter-spacing:.16em;white-space:nowrap;color:var(--p);display:inline-flex;align-items:center}
.gb{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin:0 .1em 0 .02em;flex:none;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 42%),radial-gradient(circle,rgba(60,110,80,.30) 0 .8px,transparent 1.25px) 0 0/3.6px 3.6px,radial-gradient(circle at 36% 30%,#fff,#eaf2ea 58%,#bfd2c3);box-shadow:inset -.07em -.09em .14em rgba(55,95,72,.28),0 .06em .14em rgba(30,50,38,.28)}
/* glass surfaces */
aside,header,.card,.box,table,.mc,.lc,.pf3,.tabs,.sm,.em,.kv,.k2{backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3)}
aside{background:var(--side);border:1px solid var(--edge);box-shadow:var(--sh)}

.brand .wm{font-size:16px;display:flex}.brand small{display:block;color:var(--m);letter-spacing:.05em;font-size:11.5px;margin-top:2px}

nav a:hover{background:var(--soft);opacity:1}
nav a.on{background:var(--soft);color:var(--p);opacity:1;font-weight:650;box-shadow:inset 0 0 0 1px var(--edge),0 4px 14px color-mix(in srgb,var(--p) 14%,transparent)}
nav a.sub{padding-left:32px}#vr{color:var(--m)}
